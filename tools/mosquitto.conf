# Cau hinh Mosquitto cho do an Smart Irrigation
# - 1883: MQTT thuong, firmware (Proteus/RPi) ket noi vao day
# - 9001: MQTT qua WebSockets, dashboard (trinh duyet) ket noi vao day

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Mosquitto 2.x: co file cau hinh rieng thi mac dinh chan ket noi an danh,
# nen phai bat dong nay (chi nen dung trong mang noi bo / mo phong).
allow_anonymous true
